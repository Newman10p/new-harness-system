<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.A.I. — Agentic Interface v3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       ROOT VARIABLES & BASE
    ═══════════════════════════════════════════════════════════════════════ */
    :root {
      --bg: #020817;
      --primary: #00d4ff;
      --secondary: #00ffcc;
      --text: #c8f0ff;
      --dim: #5a7d99;
      --danger: #ff3366;
      --warning: #ffaa00;
      --success: #00ff88;
      --glass-bg: rgba(2, 15, 35, 0.55);
      --glass-border: rgba(0, 212, 255, 0.18);
      --glass-blur: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Rajdhani, sans-serif;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       SCANLINE CRT OVERLAY
    ═══════════════════════════════════════════════════════════════════════ */
    #scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.03) 0px,
        rgba(0, 0, 0, 0.03) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       THREE.JS CANVAS — Behind everything
    ═══════════════════════════════════════════════════════════════════════ */
    #globe-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      opacity: 0.45;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PARTICLE SYSTEM
    ═══════════════════════════════════════════════════════════════════════ */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 6px var(--primary), 0 0 12px rgba(0, 212, 255, 0.3);
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) translateX(0); }
      10% { opacity: 0.8; }
      90% { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-105vh) translateX(var(--drift, 30px)); }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       GRID BACKGROUND
    ═══════════════════════════════════════════════════════════════════════ */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: .12;
      background-image:
        linear-gradient(rgba(0,212,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.12) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle, black, transparent 80%);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       TYPOGRAPHY
    ═══════════════════════════════════════════════════════════════════════ */
    .display { font-family: Orbitron, sans-serif; }
    .mono { font-family: "JetBrains Mono", monospace; }

    /* ═══════════════════════════════════════════════════════════════════════
       GLASSMORPHISM PANELS
    ═══════════════════════════════════════════════════════════════════════ */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      box-shadow:
        inset 0 0 30px rgba(0, 212, 255, .03),
        0 0 40px rgba(0, 0, 0, .5),
        0 8px 32px rgba(0, 0, 0, .3);
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       HOLOGRAPHIC RAINBOW EDGE ON HOVER
    ═══════════════════════════════════════════════════════════════════════ */
    .holo-edge {
      position: relative;
      overflow: hidden;
    }
    .holo-edge::before {
      content: "";
      position: absolute;
      inset: -2px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(0, 212, 255, 0.0) 0%,
        rgba(0, 212, 255, 0.0) 35%,
        rgba(0, 255, 204, 0.5) 42%,
        rgba(0, 212, 255, 0.7) 50%,
        rgba(138, 43, 226, 0.5) 58%,
        rgba(0, 212, 255, 0.0) 65%,
        rgba(0, 212, 255, 0.0) 100%
      );
      background-size: 300% 300%;
      opacity: 0;
      transition: opacity 0.4s ease, background-position 0.4s ease;
    }
    .holo-edge:hover::before {
      opacity: 1;
      background-position: 100% 100%;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       GLOW EFFECTS
    ═══════════════════════════════════════════════════════════════════════ */
    .glow {
      text-shadow: 0 0 8px currentColor, 0 0 20px rgba(0,212,255,.45);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       CORE REACTOR
    ═══════════════════════════════════════════════════════════════════════ */
    .core-wrapper {
      position: relative;
      width: min(40vw, 300px);
      height: min(40vw, 300px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .core-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0, 212, 255, 0.35);
      animation: pulseRing 3s ease-in-out infinite;
    }
    .core-ring-1 { inset: 0; }
    .core-ring-2 { inset: 8%; border-color: rgba(0, 255, 204, 0.2); animation-delay: -0.5s; }
    .core-ring-3 { inset: 16%; border-color: rgba(0, 212, 255, 0.12); animation-delay: -1s; }

    .core {
      width: 58%;
      height: 58%;
      border-radius: 50%;
      border: 1px solid rgba(0,212,255,.55);
      box-shadow:
        0 0 30px rgba(0,212,255,.5),
        0 0 60px rgba(0,212,255,.2),
        inset 0 0 40px rgba(0,255,204,.35);
      animation: corePulse 2.8s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    .core::after {
      content: "";
      display: block;
      width: 30%;
      height: 30%;
      margin: 35%;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 25px 12px var(--secondary), 0 0 60px 20px rgba(0, 255, 204, 0.3);
    }

    .core.speaking {
      animation-duration: .75s;
      box-shadow:
        0 0 60px rgba(0,255,204,.85),
        0 0 120px rgba(0,255,204,.3),
        inset 0 0 50px rgba(0,255,204,.55);
    }

    .core.thinking {
      animation-duration: 1.2s;
      border-color: rgba(0,150,255,.7);
      box-shadow:
        0 0 40px rgba(0,150,255,.6),
        0 0 80px rgba(0,150,255,.2),
        inset 0 0 40px rgba(0,150,255,.3);
    }

    .core.call-active {
      animation-duration: 0.6s;
      border-color: rgba(255, 51, 102, 0.6);
      box-shadow:
        0 0 50px rgba(255, 51, 102, 0.5),
        0 0 100px rgba(255, 51, 102, 0.2),
        inset 0 0 40px rgba(255, 51, 102, 0.25);
    }

    .core.error {
      animation-duration: 0.5s;
      border-color: rgba(255, 51, 102, 0.8);
      box-shadow:
        0 0 40px rgba(255, 51, 102, 0.7),
        inset 0 0 30px rgba(255, 51, 102, 0.4);
    }

    @keyframes corePulse {
      0%, 100% { transform: scale(.93); opacity: .75; }
      50% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(.96); opacity: .4; }
      50% { transform: scale(1.04); opacity: .8; }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       CONNECTION STATUS
    ═══════════════════════════════════════════════════════════════════════ */
    .conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      transition: background .3s, box-shadow .3s;
    }
    .conn-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .conn-dot.disconnected { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .conn-dot.connecting { background: var(--warning); animation: blink 1s infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       MIC & CALL BUTTONS
    ═══════════════════════════════════════════════════════════════════════ */
    .mic.active {
      border-color: var(--danger) !important;
      background: rgba(255,51,102,.2) !important;
      box-shadow: 0 0 25px rgba(255,51,102,.6);
    }

    .call-btn.active {
      border-color: var(--danger) !important;
      background: rgba(255,51,102,.25) !important;
      box-shadow: 0 0 25px rgba(255,51,102,.6);
      animation: callPulse 1.5s ease-in-out infinite;
    }

    @keyframes callPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(255,51,102,.4); }
      50% { box-shadow: 0 0 35px rgba(255,51,102,.8); }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       METRIC BARS & SPARKLINES
    ═══════════════════════════════════════════════════════════════════════ */
    .metric-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(0,212,255,.12);
      overflow: hidden;
    }
    .metric-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .5s ease, background .5s ease;
      background: var(--success);
    }
    .metric-bar-fill.warn { background: var(--warning); }
    .metric-bar-fill.critical { background: var(--danger); }

    .sparkline {
      width: 100%;
      height: 24px;
      display: block;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       LOG SCROLLBAR
    ═══════════════════════════════════════════════════════════════════════ */
    .log {
      scrollbar-width: thin;
      scrollbar-color: rgba(0,212,255,.4) transparent;
    }
    .log::-webkit-scrollbar { width: 4px; }
    .log::-webkit-scrollbar-track { background: transparent; }
    .log::-webkit-scrollbar-thumb { background: rgba(0,212,255,.4); border-radius: 2px; }

    /* ═══════════════════════════════════════════════════════════════════════
       COMMAND INPUT
    ═══════════════════════════════════════════════════════════════════════ */
    .command-input {
      width: 100%;
      outline: none;
      border: 0;
      color: var(--text);
      background: transparent;
      font: 14px "JetBrains Mono", monospace;
    }
    .command-input::placeholder { color: var(--dim); }

    /* ═══════════════════════════════════════════════════════════════════════
       APPROVAL BANNER
    ═══════════════════════════════════════════════════════════════════════ */
    .approval-banner {
      display: none;
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      animation: slideUp .3s ease-out;
    }
    .approval-banner.visible { display: flex; }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(20px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       THREAT LEVEL COLORS
    ═══════════════════════════════════════════════════════════════════════ */
    .threat-green { color: var(--success); }
    .threat-yellow { color: var(--warning); }
    .threat-orange { color: #ff6600; }
    .threat-red { color: var(--danger); }

    /* ═══════════════════════════════════════════════════════════════════════
       WAVEFORM VISUALIZER
    ═══════════════════════════════════════════════════════════════════════ */
    #waveformCanvas {
      width: 100%;
      height: 60px;
      border-radius: 6px;
      border: 1px solid rgba(0, 212, 255, 0.15);
      background: rgba(0, 10, 25, 0.5);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       FILE MANAGER
    ═══════════════════════════════════════════════════════════════════════ */
    .file-list {
      scrollbar-width: thin;
      scrollbar-color: rgba(0,212,255,.3) transparent;
    }
    .file-list::-webkit-scrollbar { width: 3px; }
    .file-list::-webkit-scrollbar-track { background: transparent; }
    .file-list::-webkit-scrollbar-thumb { background: rgba(0,212,255,.3); border-radius: 2px; }

    .file-item {
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .file-item:hover {
      background: rgba(0, 212, 255, 0.08);
      box-shadow: inset 0 0 12px rgba(0, 212, 255, 0.05);
    }

    .file-color-md { color: #00ffcc; }
    .file-color-ts { color: #3b82f6; }
    .file-color-js { color: #eab308; }
    .file-color-json { color: #f59e0b; }
    .file-color-py { color: #10b981; }
    .file-color-html { color: #f97316; }
    .file-color-css { color: #8b5cf6; }
    .file-color-default { color: var(--dim); }
    .file-color-folder { color: var(--primary); }
    .file-color-img { color: #ec4899; }
    .file-color-lock { color: #ef4444; }
    .file-color-git { color: #6b7280; }
    .file-color-yml { color: #a78bfa; }
    .file-color-toml { color: #7c3aed; }
    .file-color-prisma { color: #0ea5e9; }
    .file-color-sql { color: #06b6d4; }
    .file-color-sh { color: #22c55e; }
    .file-color-docker { color: #0ea5e9; }
    .file-color-env { color: #d4d4d4; }
    .file-color-svg { color: #fb923c; }
    .file-color-wasm { color: #7c3aed; }

    /* ═══════════════════════════════════════════════════════════════════════
       GPU GAUGE
    ═══════════════════════════════════════════════════════════════════════ */
    .temp-gauge {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #00ff88 0%, #ffaa00 50%, #ff3366 100%);
      position: relative;
      overflow: visible;
    }
    .temp-gauge-indicator {
      position: absolute;
      top: -3px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
      transform: translateX(-50%);
      transition: left 0.5s ease;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       NETWORK ARROWS
    ═══════════════════════════════════════════════════════════════════════ */
    .net-arrow {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .net-arrow-up { color: var(--success); }
    .net-arrow-down { color: var(--primary); }

    /* ═══════════════════════════════════════════════════════════════════════
       CALL STATUS INDICATOR
    ═══════════════════════════════════════════════════════════════════════ */
    .call-status {
      display: none;
      align-items: center;
      gap: 6px;
    }
    .call-status.visible {
      display: flex;
    }
    .call-status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--danger);
      animation: blink 1s infinite;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       VOICE PERSONALITY SWITCHER
    ═══════════════════════════════════════════════════════════════════════ */
    .voice-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 10, 25, 0.6);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 20px;
      padding: 3px 4px;
    }
    .voice-option {
      padding: 3px 10px;
      border-radius: 16px;
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      color: var(--dim);
    }
    .voice-option:hover {
      color: var(--primary);
      border-color: rgba(0, 212, 255, 0.3);
    }
    .voice-option.active {
      color: var(--primary);
      background: rgba(0, 212, 255, 0.12);
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    }
    .voice-option.active-jarvis {
      color: #4da6ff;
      background: rgba(77, 166, 255, 0.12);
      border-color: rgba(77, 166, 255, 0.5);
      box-shadow: 0 0 10px rgba(77, 166, 255, 0.2);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       SECTION SEPARATOR
    ═══════════════════════════════════════════════════════════════════════ */
    .section-sep {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.2), transparent);
      margin: 8px 0;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       FILE SEARCH
    ═══════════════════════════════════════════════════════════════════════ */
    .file-search {
      width: 100%;
      outline: none;
      border: 1px solid rgba(0,212,255,0.15);
      border-radius: 4px;
      padding: 5px 8px;
      background: rgba(0, 10, 25, 0.5);
      color: var(--text);
      font: 11px "JetBrains Mono", monospace;
      transition: border-color 0.2s;
    }
    .file-search::placeholder { color: var(--dim); }
    .file-search:focus { border-color: rgba(0,212,255,0.4); }

    /* ═══════════════════════════════════════════════════════════════════════
       BREADCRUMBS
    ═══════════════════════════════════════════════════════════════════════ */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      flex-wrap: wrap;
    }
    .breadcrumb-item {
      color: var(--dim);
      cursor: pointer;
      transition: color 0.2s;
    }
    .breadcrumb-item:hover { color: var(--primary); }
    .breadcrumb-item.active { color: var(--primary); }
    .breadcrumb-sep { color: rgba(0,212,255,0.3); }

    /* ═══════════════════════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .core-wrapper {
        width: min(55vw, 220px);
        height: min(55vw, 220px);
      }
    }
  </style>
</head>
<body>
  <!-- ═══ THREE.JS GLOBE CANVAS ═══ -->
  <canvas id="globe-canvas"></canvas>

  <!-- ═══ PARTICLE SYSTEM ═══ -->
  <div id="particles"></div>

  <!-- ═══ SCANLINE OVERLAY ═══ -->
  <div id="scanlines"></div>

  <!-- ═══ MAIN UI ═══ -->
  <main id="mainUI" class="relative z-10 flex h-screen flex-col gap-3 p-3 md:p-4 lg:p-5">

    <!-- ════════════════════════════════════════════════════════════════════
         HEADER
    ════════════════════════════════════════════════════════════════════ -->
    <header class="glass rounded-lg flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <div id="connDot" class="conn-dot disconnected"></div>
        <span id="headerTitle" class="display text-xs font-bold tracking-[.25em] text-cyan-300 md:text-sm">M.A.I.//FRIDAY</span>
        <span id="agentLabel" class="mono hidden text-xs text-cyan-600 md:inline">AGENTIC INTERFACE v3.0</span>
        <!-- Voice Personality Switcher -->
        <div class="voice-switcher ml-2">
          <div id="voiceFriday" class="voice-option active" onclick="switchVoice('friday')">F.R.I.D.A.Y</div>
          <div id="voiceJarvis" class="voice-option" onclick="switchVoice('jarvis')">J.A.R.V.I.S</div>
        </div>
        <!-- Call Status -->
        <div id="callStatus" class="call-status ml-3">
          <div class="call-status-dot"></div>
          <span class="display text-xs tracking-widest" style="color:var(--danger)">CALL ACTIVE</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="hidden text-right sm:block">
          <div id="dateDisplay" class="mono text-xs text-cyan-600"></div>
          <div id="timeDisplay" class="display text-cyan-300 glow"></div>
        </div>

        <!-- File Manager Toggle -->
        <button id="fileMgrBtn"
          class="holo-edge glass flex h-10 w-10 items-center justify-center rounded-full border border-cyan-400/40 text-cyan-300 transition hover:text-cyan-200"
          aria-label="Toggle File Manager">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
        </button>

        <!-- Voice Call Button -->
        <button id="callBtn"
          class="call-btn holo-edge glass flex h-10 w-10 items-center justify-center rounded-full border border-cyan-400/40 text-cyan-300 transition hover:text-cyan-200"
          aria-label="Toggle Voice Call">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>

  <!-- ═══════════════════════════════════════════════════════════════════════

  <script>
  (function() {
    "use strict";

    // ─── Utility ──────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);

    // ─── State ─────────────────────────────────────────────────────────────
    const state = {
      listening: false,
      speaking: false,
      callActive: false,
      voice: null,
      ws: null,
      wsUrl: `ws://${window.location.hostname}:8080`,
      reconnectTimer: null,
      reconnectAttempts: 0,
      maxReconnectDelay: 15000,
      // Sparkline data (last 30 points)
      cpuHistory: [],
      memHistory: [],
      // System status for globe reactivity
      systemStatus: "idle", // idle, active, error
      reactorPower: 0,
      // File manager
      fileManagerOpen: true,
      files: [],
      currentPath: "/",
      fileSearchQuery: "",
      // Audio context for waveform
      audioContext: null,
      analyser: null,
      mediaStream: null,
      // Globe reference
      globeRotationSpeed: 0.001,
      globeMaterial: null,
      globeLight: null,
    };

    // ═══════════════════════════════════════════════════════════════════════
    //  THREE.JS 3D GLOBE
    // ═══════════════════════════════════════════════════════════════════════
    function initGlobe() {
      const canvas = $("globe-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 4.5;

      // Globe wireframe
      const geometry = new THREE.SphereGeometry(1.5, 32, 24);
      const material = new THREE.MeshBasicMaterial({
        color: 0x00d4ff,
        wireframe: true,
        transparent: true,
        opacity: 0.15,
      });
      state.globeMaterial = material;
      const globe = new THREE.Mesh(geometry, material);
      scene.add(globe);

      // Inner glow sphere
      const innerGlow = new THREE.Mesh(
        new THREE.SphereGeometry(1.48, 32, 24),
        new THREE.MeshBasicMaterial({
          color: 0x00ffcc,
          transparent: true,
          opacity: 0.03,
        })
      );
      scene.add(innerGlow);

      // Point light for glow effect
      const light = new THREE.PointLight(0x00d4ff, 0.8, 8);
      light.position.set(0, 0, 0);
      scene.add(light);
      state.globeLight = light;

      // Ambient particles in 3D scene
      const particlesGeo = new THREE.BufferGeometry();
      const pCount = 300;
      const pPositions = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount * 3; i++) {
        pPositions[i] = (Math.random() - 0.5) * 12;
      }
      particlesGeo.setAttribute("position", new THREE.BufferAttribute(pPositions, 3));
      const particlesMat = new THREE.PointsMaterial({
        color: 0x00d4ff,
        size: 0.02,
        transparent: true,
        opacity: 0.5,
      });
      const particles = new THREE.Points(particlesGeo, particlesMat);
      scene.add(particles);

      // Orbiting rings
      const ringGeo = new THREE.RingGeometry(2.0, 2.05, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00d4ff,
        transparent: true,
        opacity: 0.08,
        side: THREE.DoubleSide,
      });
      const ring1 = new THREE.Mesh(ringGeo, ringMat);
      ring1.rotation.x = Math.PI * 0.4;
      ring1.rotation.y = Math.PI * 0.1;
      scene.add(ring1);

      const ring2 = ring1.clone();
      ring2.rotation.x = Math.PI * 0.6;
      ring2.rotation.y = -Math.PI * 0.2;
      ring2.material = ringMat.clone();
      ring2.material.opacity = 0.05;
      scene.add(ring2);

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);

        globe.rotation.y += state.globeRotationSpeed;
        innerGlow.rotation.y -= state.globeRotationSpeed * 0.5;
        particles.rotation.y += 0.0002;
        ring1.rotation.z += 0.0005;
        ring2.rotation.z -= 0.0003;

        renderer.render(scene, camera);
      }
      animate();

      // Handle resize
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  CSS PARTICLE SYSTEM
    // ═══════════════════════════════════════════════════════════════════════
    function createParticle() {
      const container = $("particles");
      const p = document.createElement("div");
      p.className = "particle";
      const x = Math.random() * 100;
      const duration = 8 + Math.random() * 12;
      const size = 1.5 + Math.random() * 2.5;
      const drift = (Math.random() - 0.5) * 80;
      p.style.cssText = `
        left: ${x}%;
        width: ${size}px;
        height: ${size}px;
        animation-duration: ${duration}s;
        animation-delay: ${Math.random() * duration}s;
        --drift: ${drift}px;
      `;
      container.appendChild(p);

      // Remove after animation ends to prevent memory leak
      setTimeout(() => {
        if (p.parentNode) p.parentNode.removeChild(p);
      }, (duration + duration) * 1000);
    }

    function initParticles() {
      // Initial batch
      for (let i = 0; i < 30; i++) createParticle();
      // Continuously create new particles
      setInterval(() => {
        const count = state.systemStatus === "active" ? 3 : state.systemStatus === "error" ? 1 : 1;
        for (let i = 0; i < count; i++) createParticle();
      }, 800);
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  SPARKLINE RENDERER
    // ═══════════════════════════════════════════════════════════════════════
    function renderSparkline(svgId, data, color) {
      const svg = $(svgId);
      if (!svg || data.length < 2) return;

      const maxVal = Math.max(...data, 1);
      const w = 200, h = 24;
      const step = w / (30 - 1);

      // Pad to 30 points
      const points = [];
      for (let i = 0; i < 30; i++) {
        const idx = data.length - 30 + i;
        points.push(idx >= 0 ? data[idx] : 0);
      }

      let pathD = "";
      let fillD = `M0,${h} `;

      points.forEach((val, i) => {
        const x = i * step;
        const y = h - (val / maxVal) * (h - 2);
        if (i === 0) {
          pathD += `M${x},${y}`;
          fillD += `L${x},${y}`;
        } else {
          const prevX = (i - 1) * step;
          const prevIdx = i - 1;
          const prevY = h - (points[prevIdx] / maxVal) * (h - 2);
          const cpX = (prevX + x) / 2;
          pathD += ` C${cpX},${prevY} ${cpX},${y} ${x},${y}`;
          fillD += ` C${cpX},${prevY} ${cpX},${y} ${x},${y}`;
        }
      });

      fillD += ` L${w},${h} Z`;

      svg.innerHTML = `
        <defs>
          <linearGradient id="${svgId}-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.0"/>
          </linearGradient>
        </defs>
        <path d="${fillD}" fill="url(#${svgId}-grad)" />
        <path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" />
      `;
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  GLOBE STATUS REACTIVITY
    // ═══════════════════════════════════════════════════════════════════════
    function updateGlobeForStatus(status) {
      state.systemStatus = status;
      if (!state.globeMaterial) return;

      switch (status) {
        case "active":
          state.globeRotationSpeed = 0.004;
          state.globeMaterial.color.setHex(0x00d4ff);
          state.globeMaterial.opacity = 0.25;
          if (state.globeLight) state.globeLight.color.setHex(0x00ffcc);
          if (state.globeLight) state.globeLight.intensity = 1.2;
          $("globe-canvas").style.opacity = "0.55";
          break;
        case "error":
          state.globeRotationSpeed = 0.006;
          state.globeMaterial.color.setHex(0xff3366);
          state.globeMaterial.opacity = 0.2;
          if (state.globeLight) state.globeLight.color.setHex(0xff3366);
          if (state.globeLight) state.globeLight.intensity = 0.8;
          $("globe-canvas").style.opacity = "0.5";
          break;
        default: // idle
          state.globeRotationSpeed = 0.001;
          state.globeMaterial.color.setHex(0x00d4ff);
          state.globeMaterial.opacity = 0.12;
          if (state.globeLight) state.globeLight.color.setHex(0x00d4ff);
          if (state.globeLight) state.globeLight.intensity = 0.5;
          $("globe-canvas").style.opacity = "0.35";
          break;
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  VOICE PERSONALITY SYSTEM
    // ═══════════════════════════════════════════════════════════════════════

    const VOICE_PROFILES = {
      friday: {
        name: "F.R.I.D.A.Y",
        headerTitle: "M.A.I.//FRIDAY",
        footerLabel: "FRIDAY<span class=\"text-cyan-600\">&gt;</span>",
        wakeBtn: "ENGAGE FRIDAY",
        logPrefix: "FRIDAY",
        voiceClass: "friday",
        // British female voice selection
        selectVoice: (voices) => {
          const british = voices.filter(v => /^en-GB/i.test(v.lang));
          return voices.find(v => /Google UK English Female/i.test(v.name)) ||
            voices.find(v => /^Microsoft.*(Hazel|Libby|Sonia)/i.test(v.name) && /^en-GB/i.test(v.lang)) ||
            british.find(v => /female|serena|kate|susan|hazel|libby|sonia/i.test(v.name)) ||
            british[0] ||
            voices.find(v => /^en-US/i.test(v.lang)) ||
            voices[0];
        },
        rate: 0.94,
        pitch: 1.08,
        greeting: "Good day. M.A.I. systems online and at your service. The new holographic interface is fully operational. How may I assist you?",
        responseGreeting: "Yes, how may I help?",
        greetHour: (h) => h < 12 ? "Good morning." : h < 18 ? "Good afternoon." : "Good evening.",
      },
      jarvis: {
        name: "J.A.R.V.I.S",
        headerTitle: "M.A.I.//JARVIS",
        footerLabel: "JARVIS<span class=\"text-cyan-600\">&gt;</span>",
        wakeBtn: "ENGAGE JARVIS",
        logPrefix: "JARVIS",
        voiceClass: "friday",
        // British male voice selection
        selectVoice: (voices) => {
          const british = voices.filter(v => /^en-GB/i.test(v.lang));
          return voices.find(v => /Google UK English Male/i.test(v.name)) ||
            voices.find(v => /^Microsoft.*(Daniel|George)/i.test(v.name) && /^en-GB/i.test(v.lang)) ||
            british.find(v => /male|daniel|george|james|oliver/i.test(v.name)) ||
            british[0] ||
            voices.find(v => /^en-US/i.test(v.lang) && /male/i.test(v.name)) ||
            voices.find(v => /^en-US/i.test(v.lang)) ||
            voices[0];
        },
        rate: 0.88,
        pitch: 0.82,
        greeting: "All systems are online and fully operational. The holographic interface is at your disposal. How may I be of service, sir?",
        responseGreeting: "At your service, sir.",
        greetHour: (h) => h < 12 ? "Good morning, sir." : h < 18 ? "Good afternoon, sir." : "Good evening, sir.",
      }
    };

    // Current voice personality
    state.personality = localStorage.getItem("mai-personality") || "friday";

    function getProfile() {
      return VOICE_PROFILES[state.personality] || VOICE_PROFILES.friday;
    }

    function switchVoice(personality) {
      state.personality = personality;
      localStorage.setItem("mai-personality", personality);
      const profile = getProfile();

      // Update all UI labels
      $("headerTitle").textContent = profile.headerTitle;
      $("footerLabel").innerHTML = profile.footerLabel;
      $("wakeBtn").textContent = profile.wakeBtn;

      // Update switcher button states
      $("voiceFriday").className = "voice-option" + (personality === "friday" ? " active" : "");
      $("voiceJarvis").className = "voice-option" + (personality === "jarvis" ? " active-jarvis" : "");

      // Reload voice
      loadVoices();

      // Notify backend of personality change
      sendWS({ type: "voice_switch", personality });

      // Announce switch
      addLog(`Voice switched to ${profile.name}`, "system");
      speak(profile.greetHour(new Date().getHours()) + ` ${profile.name} interface active.`);
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      const voices = speechSynthesis.getVoices();
      const profile = getProfile();
      state.voice = profile.selectVoice(voices);
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      speechSynthesis.addEventListener("voiceschanged", loadVoices);
    }

    // Strip markdown formatting for clean TTS output
    function stripMarkdown(text) {
      return text
        .replace(/#{1,6}\s+/g, "")                          // headings
        .replace(/\*{1,3}(.*?)\*{1,3}/g, "$1")               // bold/italic
        .replace(/~~(.*?)~~/g, "$1")                          // strikethrough
        .replace(/`{1,3}([^`]+)`{1,3}/g, "$1")                // inline code
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")            // links
        .replace(/^\s*[-*+]\s+/gm, "")                       // list items
        .replace(/^\s*\d+\.\s+/gm, "")                      // numbered lists
        .replace(/^---+$/gm, "")                               // horizontal rules
        .replace(/^\s*>\s+/gm, "")                            // blockquotes
        .replace(/\n{2,}/g, ". ")                             // collapse multiple newlines
        .replace(/\n/g, ", ")                                  // newlines to commas
        .replace(/\s{2,}/g, " ")                               // collapse spaces
        .trim();
    }

    function speak(text, callback) {
      const cleanText = stripMarkdown(text);
      $("response").textContent = text;
      const profile = getProfile();
      addLog(`${profile.logPrefix}: ${text.slice(0, 120)}`, profile.voiceClass);

      if (!("speechSynthesis" in window)) {
        if (callback) callback();
        return;
      }

      speechSynthesis.cancel();
      state.speaking = true;
      $("core").classList.remove("thinking");
      if (!state.callActive) $("core").classList.add("speaking");
      updateStatus("SPEAKING");

      // Pause speech recognition while speaking to prevent echo
      if (state.listening && recognition) {
        try { recognition.abort(); } catch (_) {}
      }

      const utterance = new SpeechSynthesisUtterance(cleanText);
      if (state.voice) utterance.voice = state.voice;
      utterance.lang = "en-GB";
      utterance.rate = profile.rate;
      utterance.pitch = profile.pitch;
      utterance.volume = 1;

      const finished = () => {
        state.speaking = false;
        $("core").classList.remove("speaking");
        if (state.callActive) {
          $("core").classList.add("call-active");
          updateStatus("CALL ACTIVE");
        } else {
          updateStatus(state.listening ? "LISTENING" : "STANDBY");
        }
        // Resume speech recognition after speaking
        if (state.listening && recognition) {
          setTimeout(() => { try { recognition.start(); } catch (_) {} }, 200);
        }
        if (callback) callback();
      };

      utterance.onend = finished;
      utterance.onerror = finished;
      setTimeout(() => speechSynthesis.speak(utterance), 60);
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  UI HELPERS
    // ═══════════════════════════════════════════════════════════════════════
    function updateStatus(text) {
      $("status").textContent = text;
    }

    function setConnStatus(status) {
      const dot = $("connDot");
      dot.className = "conn-dot " + status;
      if (status === "connected") updateStatus("STANDBY");
      else if (status === "connecting") updateStatus("CONNECTING...");
      else updateStatus("DISCONNECTED");
    }

    function addLog(text, type = "system") {
      const colors = {
        system: "text-cyan-400/75",
        user: "text-amber-300",
        friday: "text-cyan-300",
        action: "text-emerald-400/80",
        error: "text-red-400/80",
        warning: "text-amber-400/80",
        policy: "text-orange-400/80"
      };
      const item = document.createElement("div");
      item.className = colors[type] || colors.system;
      item.textContent = `[${new Date().toLocaleTimeString("en-GB", { hour12: false })}] ${text}`;

      const container = $("logContainer");
      container.appendChild(item);
      while (container.children.length > 200) container.removeChild(container.firstChild);
      container.scrollTop = container.scrollHeight;
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  WEBSOCKET
    // ═══════════════════════════════════════════════════════════════════════
    function connectWS() {
      if (state.ws && state.ws.readyState === WebSocket.OPEN) return;

      setConnStatus("connecting");
      addLog(`Connecting to ${state.wsUrl}...`);

      try {
        state.ws = new WebSocket(state.wsUrl);
      } catch (err) {
        addLog("WebSocket creation failed: " + err.message, "error");
        scheduleReconnect();
        return;
      }

      state.ws.onopen = () => {
        state.reconnectAttempts = 0;
        setConnStatus("connected");
        addLog("Connected to M.A.I. agent", "friday");
        $("core").classList.remove("thinking", "error");
      };

      state.ws.onclose = () => {
        setConnStatus("disconnected");
        addLog("Disconnected from M.A.I.", "warning");
        scheduleReconnect();
      };

      state.ws.onerror = () => {
        addLog("WebSocket error", "error");
      };

      state.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleWSMessage(msg);
        } catch { /* ignore non-JSON */ }
      };
    }

    function scheduleReconnect() {
      if (state.reconnectTimer) return;
      const delay = Math.min(1000 * Math.pow(1.5, state.reconnectAttempts), state.maxReconnectDelay);
      state.reconnectAttempts++;
      addLog(`Reconnecting in ${Math.round(delay / 1000)}s (attempt ${state.reconnectAttempts})...`, "warning");
      state.reconnectTimer = setTimeout(() => {
        state.reconnectTimer = null;
        connectWS();
      }, delay);
    }

    function sendWS(data) {
      if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify(data));
      } else {
        addLog("Cannot send — not connected", "error");
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  HANDLE INCOMING HUD MESSAGES
    // ═══════════════════════════════════════════════════════════════════════
    function handleWSMessage(msg) {
      switch (msg.channel) {
        // ── Existing channels ──
        case "jarvis_speech": {
          const text = msg.payload?.text || "";
          if (text) speak(text);
          break;
        }

        case "activity_log": {
          const level = msg.payload?.level || "info";
          const message = msg.payload?.message || "";
          if (message) {
            const typeMap = { info: "system", warn: "warning", error: "error" };
            addLog(message, typeMap[level] || "system");

            // Detect approval requests in activity log messages
            if (message.includes("Approval required") || message.includes("approval")) {
              // Extract action name from message like "Approval required for: execute-terminal"
              const match = message.match(/Approval required for:\s*(\S+)/);
              if (match) {
                showApproval(match[1]);
              }
            }
          }
          break;
        }

        case "approval_request": {
          // Direct approval request from backend
          const actionName = msg.payload?.action || msg.payload?.name || "unknown-action";
          const detail = msg.payload?.detail || "";
          showApproval(actionName, detail);
          if (detail) addLog(`Approval detail: ${detail}`, "warning");
          break;
        }

        case "voice_switch": {
          // Sync personality from another client or backend
          const personality = msg.payload?.personality;
          if (personality && personality !== state.personality) {
            state.personality = personality;
            localStorage.setItem("mai-personality", personality);
            const profile = getProfile();
            $("headerTitle").textContent = profile.headerTitle;
            $("footerLabel").innerHTML = profile.footerLabel;
            $("wakeBtn").textContent = profile.wakeBtn;
            $("voiceFriday").className = "voice-option" + (personality === "friday" ? " active" : "");
            $("voiceJarvis").className = "voice-option" + (personality === "jarvis" ? " active-jarvis" : "");
            loadVoices();
            addLog(`Voice synced to ${profile.name}`, "system");
          }
          break;
        }

        case "system_metrics": {
          const cpu = msg.payload?.cpu ?? 0;
          const mem = msg.payload?.memory ?? 0;
          const disk = msg.payload?.disk ?? 0;
          const memTotal = msg.payload?.memory_total_gb ?? 16;
          const memUsed = msg.payload?.memory_used_gb ?? 0;

          // CPU
          $("cpuVal").textContent = cpu.toFixed(1) + "%";
          $("cpuBar").style.width = cpu + "%";
          $("cpuBar").className = "metric-bar-fill" + (cpu > 80 ? " critical" : cpu > 60 ? " warn" : "");
          state.cpuHistory.push(cpu);
          if (state.cpuHistory.length > 30) state.cpuHistory.shift();
          renderSparkline("cpuSparkline", state.cpuHistory, cpu > 80 ? "#ff3366" : cpu > 60 ? "#ffaa00" : "#00d4ff");

          // Memory
          if (memUsed > 0) {
            $("memVal").textContent = `${memUsed.toFixed(1)}/${memTotal} GB`;
          } else {
            $("memVal").textContent = mem.toFixed(1) + "%";
          }
          $("memBar").style.width = mem + "%";
          $("memBar").className = "metric-bar-fill" + (mem > 85 ? " critical" : mem > 70 ? " warn" : "");
          state.memHistory.push(mem);
          if (state.memHistory.length > 30) state.memHistory.shift();
          renderSparkline("memSparkline", state.memHistory, mem > 85 ? "#ff3366" : mem > 70 ? "#ffaa00" : "#00ffcc");

          // Disk
          if (disk > 0) {
            const diskTotal = msg.payload?.disk_total_gb ?? 0;
            const diskUsed = msg.payload?.disk_used_gb ?? 0;
            if (diskUsed > 0 && diskTotal > 0) {
              $("diskVal").textContent = `${diskUsed.toFixed(1)}/${diskTotal} GB`;
            } else {
              $("diskVal").textContent = disk.toFixed(1) + "%";
            }
            $("diskBar").style.width = disk + "%";
            $("diskBar").className = "metric-bar-fill" + (disk > 90 ? " critical" : disk > 75 ? " warn" : "");
          }

          break;
        }

        case "threat_level": {
          const level = msg.payload?.level || "green";
          const detail = msg.payload?.detail || "";
          const threatEl = $("threat");
          threatEl.textContent = level.toUpperCase();
          threatEl.className = "threat-" + level;
          if (detail) addLog(`Threat: ${detail}`, level === "green" ? "system" : "warning");

          if (level === "red" || level === "orange") {
            updateGlobeForStatus("error");
            $("core").classList.add("error");
          }
          break;
        }

        case "reactor_pulse": {
          const power = msg.payload?.power ?? 0;
          const rstatus = msg.payload?.status || "idle";
          state.reactorPower = power;

          $("reactorVal").textContent = power + "% — " + rstatus.toUpperCase();
          $("reactorBar").style.width = power + "%";

          $("core").classList.remove("thinking", "error");
          if (rstatus === "active") {
            $("core").classList.add("thinking");
            updateStatus("PROCESSING");
            updateGlobeForStatus("active");
          } else {
            if (!state.speaking && !state.listening) {
              updateStatus(state.callActive ? "CALL ACTIVE" : "STANDBY");
            }
            updateGlobeForStatus("idle");
          }
          break;
        }

        // ── NEW channels ──
        case "file_list": {
          const files = msg.payload?.files || [];
          state.files = files;
          renderFileList();
          break;
        }

        case "voice_call_state": {
          const active = msg.payload?.active ?? false;
          const transcript = msg.payload?.transcript || "";
          if (active && !state.callActive) {
            startCallMode();
          } else if (!active && state.callActive) {
            stopCallMode();
          }
          if (transcript && !state.speaking) {
            $("response").textContent = transcript;
          }
          break;
        }

        case "network_stats": {
          const up = msg.payload?.upload_bps ?? 0;
          const down = msg.payload?.download_bps ?? 0;
          $("netUpVal").textContent = "↑ " + formatBytes(up) + "/s";
          $("netDownVal").textContent = "↓ " + formatBytes(down) + "/s";
          break;
        }

        case "gpu_stats": {
          const temp = msg.payload?.temperature ?? 0;
          const util = msg.payload?.utilization ?? 0;
          const memUsed = msg.payload?.memory_used ?? 0;
          const memTotal = msg.payload?.memory_total ?? 0;

          $("gpuTempVal").textContent = temp + "°C";
          $("gpuTempVal").style.color = temp > 80 ? "var(--danger)" : temp > 60 ? "var(--warning)" : "var(--text)";

          // Position indicator: 30°C = 0%, 95°C = 100%
          const pct = Math.max(0, Math.min(100, ((temp - 30) / 65) * 100));
          $("gpuTempIndicator").style.left = pct + "%";

          $("gpuUtilVal").textContent = `Util: ${util.toFixed(0)}% | VRAM: ${memUsed.toFixed(1)}/${memTotal.toFixed(1)} GB`;
          break;
        }

        default:
          addLog(`Unknown channel: ${msg.channel}`, "warning");
      }
    }

    // ─── Format bytes helper ──────────────────────────────────────────────
    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  USER COMMANDS
    // ═══════════════════════════════════════════════════════════════════════
    function processCommand(input) {
      const text = input.trim();
      if (!text) return;
      addLog(`USER: ${text}`, "user");
      sendWS({ type: "user_input", text });
      updateStatus("PROCESSING");
      $("core").classList.remove("speaking");
      $("core").classList.add("thinking");
      updateGlobeForStatus("active");
    }

    function showApproval(actionName, detail) {
      $("approvalAction").textContent = actionName;
      $("approvalDetail").textContent = detail || "";
      $("approvalBanner").classList.add("visible");
      addLog(`Approval requested: ${actionName}`, "policy");
    }

    function resolveApproval(approved) {
      sendWS({ type: "approval_response", approved });
      $("approvalBanner").classList.remove("visible");
      addLog(approved ? "Action APPROVED" : "Action DENIED", approved ? "action" : "error");
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  VOICE CALL MODE
    // ═══════════════════════════════════════════════════════════════════════
    function startCallMode() {
      state.callActive = true;
      $("callBtn").classList.add("active");
      $("callStatus").classList.add("visible");
      $("waveformWrapper").style.opacity = "1";
      $("core").classList.remove("speaking", "thinking");
      $("core").classList.add("call-active");
      updateStatus("CALL ACTIVE");
      addLog("Voice call mode ACTIVATED", "friday");

      // Start mic if not already listening
      if (!state.listening && recognition) {
        try { recognition.start(); } catch (_) {}
        state.listening = true;
        $("micBtn").classList.add("active");
      }

      // Start audio visualizer
      startWaveformVisualizer();
    }

    function stopCallMode() {
      state.callActive = false;
      $("callBtn").classList.remove("active");
      $("callStatus").classList.remove("visible");
      $("waveformWrapper").style.opacity = "0";
      $("core").classList.remove("call-active");
      updateStatus(state.listening ? "LISTENING" : "STANDBY");
      addLog("Voice call mode DEACTIVATED", "friday");

      stopWaveformVisualizer();
    }

    function toggleCallMode() {
      if (state.callActive) {
        stopCallMode();
        sendWS({ type: "voice_call", active: false });
      } else {
        startCallMode();
        sendWS({ type: "voice_call", active: true });
        speak("Voice call link established. I'm listening.");
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  WAVEFORM VISUALIZER
    // ═══════════════════════════════════════════════════════════════════════
    let waveformAnimId = null;

    function startWaveformVisualizer() {
      const canvas = $("waveformCanvas");
      canvas.width = canvas.offsetWidth * 2;
      canvas.height = canvas.offsetHeight * 2;
      const ctx = canvas.getContext("2d");

      // Create audio context and analyser
      if (!state.audioContext) {
        state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      state.audioContext.resume();

      if (!state.analyser) {
        state.analyser = state.audioContext.createAnalyser();
        state.analyser.fftSize = 256;
      }

      // Get mic stream
      if (!state.mediaStream) {
        navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }).then(stream => {
          state.mediaStream = stream;
          const source = state.audioContext.createMediaStreamSource(stream);
          source.connect(state.analyser);
        }).catch(() => {});
      }

      const bufferLength = state.analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function drawWaveform() {
        if (!state.callActive) return;
        waveformAnimId = requestAnimationFrame(drawWaveform);

        state.analyser.getByteTimeDomainData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw waveform
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255, 51, 102, 0.8)";
        ctx.shadowColor = "rgba(255, 51, 102, 0.5)";
        ctx.shadowBlur = 8;
        ctx.beginPath();

        const sliceWidth = canvas.width / bufferLength;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = v * canvas.height / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }

        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();

        // Secondary glow line
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(0, 212, 255, 0.3)";
        ctx.shadowColor = "rgba(0, 212, 255, 0.3)";
        ctx.shadowBlur = 4;
        ctx.beginPath();
        x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = v * canvas.height / 2 + 3;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.lineTo(canvas.width, canvas.height / 2 + 3);
        ctx.stroke();
      }

      drawWaveform();
    }

    function stopWaveformVisualizer() {
      if (waveformAnimId) {
        cancelAnimationFrame(waveformAnimId);
        waveformAnimId = null;
      }

      if (state.mediaStream) {
        state.mediaStream.getTracks().forEach(t => t.stop());
        state.mediaStream = null;
      }

      const canvas = $("waveformCanvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  FILE MANAGER
    // ═══════════════════════════════════════════════════════════════════════
    function getFileColorClass(filename) {
      const ext = filename.split(".").pop().toLowerCase();
      const map = {
        md: "file-color-md",
        ts: "file-color-ts", tsx: "file-color-ts",
        js: "file-color-js", jsx: "file-color-js", mjs: "file-color-js",
        json: "file-color-json", jsonl: "file-color-json",
        py: "file-color-py", pyw: "file-color-py",
        html: "file-color-html", htm: "file-color-html",
        css: "file-color-css", scss: "file-color-css", less: "file-color-css",
        yml: "file-color-yml", yaml: "file-color-yml",
        toml: "file-color-toml",
        prisma: "file-color-prisma",
        sql: "file-color-sql",
        sh: "file-color-sh", bash: "file-color-sh",
        svg: "file-color-svg",
        wasm: "file-color-wasm",
        png: "file-color-img", jpg: "file-color-img", jpeg: "file-color-img",
        gif: "file-color-img", webp: "file-color-img", ico: "file-color-img",
        lock: "file-color-lock",
        gitignore: "file-color-git",
        dockerfile: "file-color-docker", env: "file-color-env",
      };
      // Special filenames
      if (filename === ".gitignore" || filename === ".git") return "file-color-git";
      if (filename === "Dockerfile" || filename.startsWith("docker-compose")) return "file-color-docker";
      if (filename.startsWith(".env")) return "file-color-env";
      return map[ext] || "file-color-default";
    }

    function getFileIcon(type) {
      if (type === "directory" || type === "folder") {
        return `<svg class="w-3.5 h-3.5 flex-shrink-0 file-color-folder" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>`;
      }
      return `<svg class="w-3.5 h-3.5 flex-shrink-0 opacity-50" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`;
    }

    function renderBreadcrumbs() {
      const container = $("fileBreadcrumbs");
      const parts = state.currentPath.split("/").filter(Boolean);
      let html = `<span class="breadcrumb-item ${parts.length === 0 ? "active" : ""}" data-path="/">/</span>`;
      let pathSoFar = "";
      parts.forEach((part, i) => {
        pathSoFar += "/" + part;
        const isLast = i === parts.length - 1;
        html += `<span class="breadcrumb-sep">/</span>`;
        html += `<span class="breadcrumb-item ${isLast ? "active" : ""}" data-path="${pathSoFar}">${part}</span>`;
      });
      container.innerHTML = html;

      container.querySelectorAll(".breadcrumb-item").forEach(el => {
        el.addEventListener("click", () => {
          state.currentPath = el.dataset.path;
          sendWS({ type: "list_files", path: state.currentPath });
          renderBreadcrumbs();
        });
      });
    }

    function renderFileList() {
      const container = $("fileList");
      let files = state.files || [];

      // Filter by search
      if (state.fileSearchQuery) {
        const q = state.fileSearchQuery.toLowerCase();
        files = files.filter(f => f.name.toLowerCase().includes(q));
      }

      // Sort: folders first, then files
      files = [...files].sort((a, b) => {
        const aDir = (a.type === "directory" || a.type === "folder") ? 0 : 1;
        const bDir = (b.type === "directory" || b.type === "folder") ? 0 : 1;
        if (aDir !== bDir) return aDir - bDir;
        return a.name.localeCompare(b.name);
      });

      if (files.length === 0) {
        container.innerHTML = `<div class="mono text-xs text-cyan-600/60 py-4 text-center">${state.fileSearchQuery ? "No matches found" : "No files loaded"}</div>`;
        return;
      }

      container.innerHTML = files.map(f => {
        const isDir = f.type === "directory" || f.type === "folder";
        const colorClass = isDir ? "file-color-folder" : getFileColorClass(f.name);
        const sizeStr = isDir ? "—" : (f.size ? formatBytes(f.size) : "—");
        const modStr = f.modified ? new Date(f.modified).toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) : "";
        return `
          <div class="file-item mono" data-name="${f.name}" data-path="${f.path || ""}" data-type="${f.type || "file"}">
            ${getFileIcon(f.type)}
            <span class="flex-1 ${colorClass} truncate" title="${f.path || f.name}">${f.name}</span>
            ${modStr ? `<span class="text-cyan-700 text-xs flex-shrink-0" style="font-size:10px">${modStr}</span>` : ""}
            ${!isDir ? `<span class="text-cyan-600 text-xs flex-shrink-0" style="font-size:10px">${sizeStr}</span>` : ""}
          </div>
        `;
      }).join("");

      container.querySelectorAll(".file-item").forEach(el => {
        el.addEventListener("click", () => {
          const type = el.dataset.type;
          const name = el.dataset.name;
          const path = el.dataset.path;
          if (type === "directory" || type === "folder") {
            state.currentPath = path || (state.currentPath === "/" ? "/" + name : state.currentPath + "/" + name);
            sendWS({ type: "list_files", path: state.currentPath });
            renderBreadcrumbs();
          } else {
            sendWS({ type: "read-file", path: path || name });
            addLog(`Reading file: ${name}`, "action");
          }
        });
      });
    }

    function toggleFileManager() {
      state.fileManagerOpen = !state.fileManagerOpen;
      const body = $("fileManagerBody");
      const collapseIcon = $("fileMgrCollapseBtn");
      if (state.fileManagerOpen) {
        body.style.display = "flex";
        collapseIcon.style.transform = "rotate(0deg)";
      } else {
        body.style.display = "none";
        collapseIcon.style.transform = "rotate(-90deg)";
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  VOICE RECOGNITION
    // ═══════════════════════════════════════════════════════════════════════
    let recognition = null;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (Recognition) {
      recognition = new Recognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-GB";

      recognition.onresult = event => {
        let interim = "";
        let finalText = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += text;
          else interim += text;
        }

        if (interim && !state.speaking) {
          $("response").textContent = `"${interim}"`;
        }

        // Ignore final results while M.A.I. is speaking to prevent echo loop
        if (finalText.trim() && !state.speaking) {
          processCommand(finalText.trim());
          $("commandInput").value = "";
        }
      };

      recognition.onerror = event => {
        if (!["no-speech", "aborted"].includes(event.error)) {
          addLog(`Recognition error: ${event.error}`, "error");
        }
      };

      recognition.onend = () => {
        if (state.listening || state.callActive) {
          try { recognition.start(); } catch (_) {}
        }
      };
    }

    function toggleListening() {
      if (!recognition) {
        speak("Voice recognition is unavailable. Please use the command console.");
        return;
      }

      state.listening = !state.listening;
      $("micBtn").classList.toggle("active", state.listening);

      if (state.listening) {
        try { recognition.start(); } catch (_) {}
        if (!state.callActive) updateStatus("LISTENING");
        addLog("Voice input engaged");
        speak("Yes, how may I help?");
      } else {
        try { recognition.stop(); } catch (_) {}
        if (!state.callActive) updateStatus("STANDBY");
        addLog("Voice input disengaged");
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  PARALLAX EFFECT
    // ═══════════════════════════════════════════════════════════════════════
    function initParallax() {
      const panels = document.querySelectorAll("[data-parallax]");
      document.addEventListener("mousemove", e => {
        const cx = (e.clientX / window.innerWidth - 0.5) * 2;
        const cy = (e.clientY / window.innerHeight - 0.5) * 2;
        panels.forEach((panel, i) => {
          const factor = (i % 2 === 0 ? 1 : -1) * 2;
          panel.style.transform = `translate(${cx * factor}px, ${cy * factor}px)`;
        });
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  CLOCK
    // ═══════════════════════════════════════════════════════════════════════
    function updateClock() {
      const now = new Date();
      $("timeDisplay").textContent = now.toLocaleTimeString("en-GB", { hour12: false });
      $("dateDisplay").textContent = now.toLocaleDateString("en-GB", {
        weekday: "short", day: "numeric", month: "short", year: "numeric"
      }).toUpperCase();
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  QUICK COMMANDS
    // ═══════════════════════════════════════════════════════════════════════
    const suggestions = [
      "What can you do?",
      "Check system info",
      "List my home directory",
      "What processes are running?",
      "Read agent/policy.md",
      "Help",
    ];

    suggestions.forEach(cmd => {
      const btn = document.createElement("button");
      btn.className = "holo-edge rounded border border-cyan-400/20 px-2 py-0.5 mono text-xs text-cyan-500 transition hover:bg-cyan-400/10 hover:text-cyan-300";
      btn.textContent = cmd;
      btn.onclick = () => {
        $("commandInput").value = cmd;
        $("commandInput").focus();
      };
      $("suggestions").appendChild(btn);
    });

    // ═══════════════════════════════════════════════════════════════════════
    //  EVENT LISTENERS
    // ═══════════════════════════════════════════════════════════════════════
    $("micBtn").addEventListener("click", toggleListening);
    $("callBtn").addEventListener("click", toggleCallMode);

    $("fileMgrBtn").addEventListener("click", toggleFileManager);
    $("fileMgrCollapseBtn").addEventListener("click", toggleFileManager);

    $("fileSearch").addEventListener("input", e => {
      state.fileSearchQuery = e.target.value;
      renderFileList();
    });

    $("wakeBtn").addEventListener("click", () => {
      if (!state.listening) toggleListening();
      else speak(getProfile().responseGreeting);
    });

    $("submitBtn").addEventListener("click", () => {
      const input = $("commandInput");
      processCommand(input.value);
      input.value = "";
    });

    $("commandInput").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        processCommand(event.target.value);
        event.target.value = "";
      }
    });

    $("approveBtn").addEventListener("click", () => resolveApproval(true));
    $("denyBtn").addEventListener("click", () => resolveApproval(false));

    // ═══════════════════════════════════════════════════════════════════════
    //  INITIALIZATION
    // ═══════════════════════════════════════════════════════════════════════
    updateClock();
    setInterval(updateClock, 1000);

    addLog("Interface v3.0 initialising...");
    addLog("Three.js globe engine loaded");
    addLog("Particle systems online");
    addLog("WebSocket target: " + state.wsUrl);

    // Initialize subsystems
    initGlobe();
    initParticles();
    initParallax();
    renderBreadcrumbs();
    renderFileList();

    // Apply saved personality on startup
    const savedProfile = getProfile();
    $("headerTitle").textContent = savedProfile.headerTitle;
    $("footerLabel").innerHTML = savedProfile.footerLabel;
    $("wakeBtn").textContent = savedProfile.wakeBtn;
    $("voiceFriday").className = "voice-option" + (state.personality === "friday" ? " active" : "");
    $("voiceJarvis").className = "voice-option" + (state.personality === "jarvis" ? " active-jarvis" : "");

    // Connect to M.A.I. backend
    connectWS();

    // Greeting after connection — use time-aware greeting
    state.greetingSpoken = false;
    setTimeout(() => {
      if (state.ws && state.ws.readyState === WebSocket.OPEN && !state.greetingSpoken) {
        state.greetingSpoken = true;
        speak(savedProfile.greeting);
      }
    }, 1500);

  })();
  </script>
</body>
</html>
