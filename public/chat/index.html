<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1a">
  <meta name="description" content="M.A.I. — Multiple Array Intelligence">
  <title>M.A.I.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- ─── Header ────────────────────────────────────────────────────────── -->
    <header class="chat-header">
      <div class="header-left">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
            <circle cx="14" cy="14" r="8" stroke="currentColor" stroke-width="1" opacity="0.4"/>
            <circle cx="14" cy="14" r="4" fill="currentColor" opacity="0.8"/>
          </svg>
          <span class="logo-text">M.A.I.</span>
        </div>
      </div>
      <div class="header-center">
        <div id="connection-status" class="connection-status">
          <span class="status-dot"></span>
          <span class="status-text">Connected</span>
        </div>
      </div>
      <div class="header-right">
        <button id="btn-settings" class="icon-btn" aria-label="Settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ─── Message Area ──────────────────────────────────────────────────── -->
    <main id="message-area" class="message-area" role="log" aria-label="Chat messages" aria-live="polite">
      <div id="message-list" class="message-list">
        <!-- Messages rendered here by JS -->
      </div>
      <div id="typing-indicator" class="typing-indicator hidden">
        <div class="typing-avatar">
          <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="4" fill="currentColor" opacity="0.8"/>
          </svg>
        </div>
        <div class="typing-dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
      <div id="scroll-anchor"></div>
    </main>

    <!-- ─── File Preview ───────────────────────────────────────────────────── -->
    <div id="file-preview" class="file-preview hidden">
      <div class="file-preview-inner">
        <img id="preview-image" src="" alt="Preview" class="preview-image hidden">
        <div class="file-preview-info">
          <span id="preview-filename" class="preview-filename"></span>
          <span id="preview-size" class="preview-size"></span>
        </div>
        <button id="preview-remove" class="icon-btn small" aria-label="Remove attachment">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ─── Input Area ────────────────────────────────────────────────────── -->
    <div class="input-area">
      <div class="input-area-inner">
        <button id="btn-attach" class="icon-btn" aria-label="Attach file" title="Attach">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <div class="input-wrapper">
          <textarea id="message-input" placeholder="Message M.A.I...." rows="1" aria-label="Message input"></textarea>
        </div>
        <button id="btn-send" class="send-btn" aria-label="Send message" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ─── Settings Panel (slide-in) ──────────────────────────────────────── -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-backdrop"></div>
      <div class="settings-content">
        <div class="settings-header">
          <h2>Configuration</h2>
          <button id="settings-close" class="icon-btn" aria-label="Close settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="settings-body">
          <!-- Model Configuration -->
          <section class="setting-section">
            <h3>Model Providers</h3>
            <p class="setting-hint">Priority: Primary → Fallback 1 → Fallback 2</p>
            
            <div class="setting-grid">
              <div class="setting-field">
                <label for="setting-primary-provider">Primary</label>
                <select id="setting-primary-provider">
                  <option value="ollama-cloud">Ollama Cloud</option>
                  <option value="openrouter">OpenRouter GLM-5.2 Free</option>
                  <option value="ollama-local">Local Ollama (llama3.2)</option>
                  <option value="phi3-local">Local Ollama (phi3-mini)</option>
                </select>
              </div>
              
              <div class="setting-field">
                <label for="setting-fallback-1">Fallback 1</label>
                <select id="setting-fallback-1">
                  <option value="openrouter">OpenRouter GLM-5.2 Free</option>
                  <option value="ollama-cloud">Ollama Cloud</option>
                  <option value="ollama-local">Local Ollama (llama3.2)</option>
                  <option value="phi3-local">Local Ollama (phi3-mini)</option>
                  <option value="none">None</option>
                </select>
              </div>
              
              <div class="setting-field">
                <label for="setting-fallback-2">Fallback 2</label>
                <select id="setting-fallback-2">
                  <option value="ollama-local">Local Ollama (llama3.2)</option>
                  <option value="phi3-local">Local Ollama (phi3-mini)</option>
                  <option value="openrouter">OpenRouter GLM-5.2 Free</option>
                  <option value="ollama-cloud">Ollama Cloud</option>
                  <option value="none">None</option>
                </select>
              </div>
            </div>
          </section>
          
          <!-- API Keys -->
          <section class="setting-section">
            <h3>API Keys</h3>
            
            <div class="setting-field">
              <label for="setting-ollama-cloud-key">Ollama Cloud</label>
              <div class="input-with-button">
                <input type="password" id="setting-ollama-cloud-key" placeholder="Enter your Ollama Cloud key">
                <button class="btn-toggle-visibility" data-target="setting-ollama-cloud-key" aria-label="Toggle visibility">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>
            
            <div class="setting-field">
              <label for="setting-openrouter-key">OpenRouter</label>
              <div class="input-with-button">
                <input type="password" id="setting-openrouter-key" placeholder="Get free key at openrouter.ai">
                <button class="btn-toggle-visibility" data-target="setting-openrouter-key" aria-label="Toggle visibility">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <p class="setting-hint"><a href="https://openrouter.ai/keys" target="_blank" rel="noopener">Get free API key</a></p>
            </div>
            
            <div class="setting-field">
              <label for="setting-ollama-endpoint">Local Ollama Endpoint</label>
              <input type="text" id="setting-ollama-endpoint" value="http://localhost:11434" placeholder="http://localhost:11434">
            </div>
          </section>
          
          <!-- Appearance -->
          <section class="setting-section">
            <h3>Appearance</h3>
            
            <div class="setting-grid">
              <div class="setting-field">
                <label for="setting-theme">Theme</label>
                <select id="setting-theme">
                  <option value="black-blue">Black & Blue</option>
                  <option value="black-red">Black & Red</option>
                  <option value="office-white">Office White</option>
                </select>
              </div>
              
              <div class="setting-field">
                <label for="setting-accent-color">Accent</label>
                <select id="setting-accent-color">
                  <option value="blue">Blue</option>
                  <option value="green">Green</option>
                  <option value="red">Red</option>
                  <option value="black">Black</option>
                </select>
              </div>
            </div>
          </section>
          
          <!-- User Profile -->
          <section class="setting-section">
            <h3>User Profile</h3>
            
            <div class="setting-field">
              <label for="setting-user-name">Name</label>
              <input type="text" id="setting-user-name" value="Bulega Farid" placeholder="Your name">
            </div>
            
            <div class="setting-field">
              <label for="setting-public-name">Public Name</label>
              <input type="text" id="setting-public-name" value="The Deadman" placeholder="Public alias">
            </div>
            
            <div class="setting-field">
              <label for="setting-preferred-address">Address As</label>
              <input type="text" id="setting-preferred-address" value="sir" placeholder="How M.A.I. should address you">
            </div>
          </section>
          
          <!-- Security -->
          <section class="setting-section">
            <h3>Security</h3>
            
            <div class="setting-field">
              <label for="setting-safety-level">Safety Level</label>
              <select id="setting-safety-level">
                <option value="conservative">Conservative</option>
                <option value="balanced" selected>Balanced</option>
                <option value="experimental">Experimental</option>
              </select>
            </div>
            
            <div class="setting-options">
              <label class="checkbox-label">
                <input type="checkbox" id="setting-sandbox-first" checked>
                <span>Sandbox-first execution</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="setting-terminal-access" checked>
                <span>Terminal access</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="setting-network-access" checked>
                <span>Network access</span>
              </label>
            </div>
          </section>
          
          <!-- Connection -->
          <section class="setting-section">
            <h3>Connection</h3>
            
            <div class="setting-field">
              <label for="setting-ws-url">WebSocket URL</label>
              <input type="text" id="setting-ws-url" value="ws://localhost:8080" placeholder="ws://host:port">
            </div>
            
            <button id="btn-reconnect" class="btn-secondary">Reconnect</button>
          </section>
          
          <!-- Data -->
          <section class="setting-section">
            <h3>Data</h3>
            
            <div class="setting-field">
              <label for="setting-vault-path">Vault Path</label>
              <input type="text" id="setting-vault-path" value="./vault" placeholder="./vault">
            </div>
            
            <div class="setting-field">
              <label for="setting-skills-path">Skills Path</label>
              <input type="text" id="setting-skills-path" value="./skills" placeholder="./skills">
            </div>
            
            <div class="setting-actions">
              <button id="btn-clear-history" class="btn-danger">Clear History</button>
              <button id="btn-save-config" class="btn-primary">Save Configuration</button>
            </div>
            <p class="setting-hint">Saves to harness.config.json and .env</p>
          </section>
          
          <!-- System Info -->
          <section class="setting-section">
            <h3>System Information</h3>
            <div id="system-info" class="system-info-box">
              <p>Loading...</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.txt,.json,.md">
  <script src="app.js"></script>
</body>
</html>
